		A1B2C3D4E5F607182934B561 /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
				"$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)",
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# sherpa-onnx's SPM binary xcframeworks (onnxruntime, SherpaOnnxC) ship\n# with a malformed versioned-bundle layout: Versions/Current and\n# top-level items (Headers, Resources, the binary itself) land as real,\n# duplicated files/dirs instead of symlinks into Versions/A, because the\n# upstream zip didn't preserve symlinks. Left as-is, every copy Xcode\n# makes carries the same brokenness into Contents/Frameworks, and the\n# final app-level codesign fails with \"code object is not signed at\n# all\" / \"bundle format is ambiguous\".\n#\n# Fixed at the ROOT: repair the SPM-resolved source artifacts themselves\n# (under DerivedData's SourcePackages/artifacts), not just the copies in\n# Contents/Frameworks. Once the source is correctly symlinked, every\n# copy Xcode makes from it afterward - regardless of exactly when or how\n# many times, including test-hosting's extra embed step for QuranTests\n# - is correct by construction. Repairing only the destination after the\n# fact (an earlier version of this script) raced against Xcode's own\n# embed step and could get silently undone by a later re-embed.\nrepair_framework() {\n  fw=\"$1\"\n  [ -d \"$fw/Versions/A\" ] || return 0\n  if [ ! -L \"$fw/Versions/Current\" ]; then\n    rm -rf \"$fw/Versions/Current\"\n    ln -s A \"$fw/Versions/Current\"\n  fi\n  for item in \"$fw\"/Versions/A/*; do\n    name=$(basename \"$item\")\n    if [ -e \"$fw/$name\" ] && [ ! -L \"$fw/$name\" ]; then\n      rm -rf \"$fw/$name\"\n      ln -s \"Versions/Current/$name\" \"$fw/$name\"\n    fi\n  done\n  codesign --force --sign - \"$fw\" 2>/dev/null || true\n}\n\nDERIVED_DATA_ROOT=\"$(cd \"$BUILD_ROOT/../..\" && pwd)\"\nif [ -d \"$DERIVED_DATA_ROOT/SourcePackages/artifacts\" ]; then\n  find \"$DERIVED_DATA_ROOT/SourcePackages/artifacts\" -iname \"*.framework\" -type d 2>/dev/null | while IFS= read -r fw; do\n    repair_framework \"$fw\"\n  done\nfi\n\nFRAMEWORKS=\"${CODESIGNING_FOLDER_PATH}/Contents/Frameworks\"\nif [ -d \"$FRAMEWORKS\" ]; then\n  for fw in \"$FRAMEWORKS\"/*.framework; do\n    [ -d \"$fw\" ] && repair_framework \"$fw\"\n  done\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

